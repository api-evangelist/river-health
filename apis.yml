name: River Health
description: >-
  River Health is an employer-sponsored virtual-first health plan operated by
  Mountain (joinmountain.com) that gives employees comprehensive primary and
  behavioral care at no cost to them. Members get unlimited virtual primary
  care and in-person doctor visits, behavioral health and therapy, thousands of
  free medications with home delivery or pharmacy pickup, free preventive care
  and screenings, after-hours urgent care, no-cost specialty and chronic-
  condition care, and free lab testing through Quest Diagnostics. Employers from
  small businesses to the Fortune 500 sponsor the plan; members enroll and manage
  care through the River Health member app at app.helloriver.com. River Health is
  a portfolio company of Techstars. No public developer API, documentation, or
  developer portal has been published.
